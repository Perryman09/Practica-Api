    // Mapeo específico de sonido según el modelo de vehículo
    function resolveModelSound(modelName, brand) {
      if (!modelName) return { url: brand.soundUrl, name: brand.soundName };
      const lower = modelName.toLowerCase();

      if (lower.includes('corvette')) return { url: SOUND_CDN + 'corvette.m4a', name: 'Chevrolet Corvette 6.2L LT2 V8 Small Block' };
      if (lower.includes('hellcat') || lower.includes('charger') || lower.includes('challenger')) return { url: SOUND_CDN + 'hellcat.m4a', name: 'Dodge SRT Hellcat 6.2L Supercharged HEMI V8' };
      if (lower.includes('focus')) return { url: SOUND_CDN + 'focusrs.m4a', name: 'Ford Focus RS 2.3L EcoBoost Turbo' };
      if (lower.includes('ford gt') || (brand.id === 'ford' && lower === 'gt')) return { url: SOUND_CDN + 'fordgt.m4a', name: 'Ford GT 3.5L Twin-Turbo EcoBoost V6' };
      if (lower.includes('lfa')) return { url: SOUND_CDN + 'lexuslfa.m4a', name: 'Lexus LFA 4.8L 1LR-GUE 72° V10 F1 Roar' };
      if (lower.includes('e63') || lower.includes('e 63')) return { url: SOUND_CDN + 'e63.m4a', name: 'Mercedes-AMG E 63 S 4.0L V8 Biturbo' };
      if (lower.includes('viper')) return { url: SOUND_CDN + 'viper.m4a', name: 'Dodge Viper 8.4L V10 Torque Monster' };
      if (lower.includes('camaro')) return { url: SOUND_CDN + 'camarozl1.m4a', name: 'Chevrolet Camaro ZL1 6.2L Supercharged LT4 V8' };
      if (lower.includes('tt rs') || lower.includes('ttrs')) return { url: SOUND_CDN + 'audittrs.m4a', name: 'Audi 2.5L TFSI 5-Cilindros Turbo' };
      if (lower.includes('panamera')) return { url: SOUND_CDN + 'panamaraturbo.m4a', name: 'Porsche Panamera Turbo 4.0L V8' };

      return { url: brand.soundUrl, name: brand.soundName };
    }

    // Resolver imagen garantizando que coincida SIEMPRE con la marca seleccionada
    function resolveCardImage(brand, modelName, modelId) {
      if (!brand) return 'https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=800&q=80';
      const brandKey = (brand.id || '').toLowerCase();
      const lower = (modelName || '').toLowerCase();

      // 1. Coincidencia con modelo específico
      for (const [key, url] of Object.entries(MODEL_PHOTO_MAP)) {
        if (lower.includes(key)) {
          return url;
        }
      }

      // 2. Galería exclusiva de la marca (Garantiza que Toyota siempre sea Toyota, Ferrari siempre Ferrari, etc.)
      const gallery = BRAND_GALLERIES[brandKey] || BRAND_GALLERIES['ferrari'];
      const idNum = Math.abs(parseInt(modelId, 10)) || (modelName ? modelName.length : 1);
      return gallery[idNum % gallery.length];
    }

    // -------------------------------------------------------------------------
    // 3. Sistema de Sonido Unificado con Control de Detención Inmediata
    // -------------------------------------------------------------------------
    let activeAudioInstance = null;
    let globalAudioCtx = null;
    const audioStateListeners = new Set();

    function notifyAudioChange(isPlaying) {
      audioStateListeners.forEach(fn => {
        try { fn(isPlaying); } catch(e) {}
      });
    }

    function getAudioContext() {
      if (!globalAudioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          globalAudioCtx = new AudioContextClass();
        }
      }
      if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
        globalAudioCtx.resume();
      }
      return globalAudioCtx;
    }

    // Desbloquear audio en el primer clic de la página
    window.addEventListener('click', () => {
      getAudioContext();
    }, { once: true });

    // Detener de forma absoluta e inmediata cualquier sonido en reproducción
    function stopAllAudio() {
      if (activeAudioInstance) {
        try {
          activeAudioInstance.pause();
          activeAudioInstance.currentTime = 0;
        } catch (err) {}
        activeAudioInstance = null;
      }
      notifyAudioChange(false);
    }

    // Sintetizador para vehículos eléctricos (Tesla)
    function playElectricWarpSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const oscHarmonic = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sine';
        oscHarmonic.type = 'triangle';

        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(1450, now + 0.5);
        osc.frequency.exponentialRampToValueAtTime(2600, now + 1.1);

        oscHarmonic.frequency.setValueAtTime(360, now);
        oscHarmonic.frequency.exponentialRampToValueAtTime(2900, now + 0.5);
        oscHarmonic.frequency.exponentialRampToValueAtTime(5200, now + 1.1);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(4500, now + 0.5);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.15);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.8);
        gain.gain.linearRampToValueAtTime(0.001, now + 1.25);

        osc.connect(filter);
        oscHarmonic.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        oscHarmonic.start(now);
        osc.stop(now + 1.3);
        oscHarmonic.stop(now + 1.3);
      } catch (err) {
        console.warn("Electric audio warning:", err);
      }
    }

    // Reproducción de la pista de escape real
    function playOriginalEngineSound(soundUrl, onEndCallback) {
      stopAllAudio();

      if (!soundUrl) {
        // Vehículo Eléctrico Supersónico (Tesla)
        notifyAudioChange(true);
        playElectricWarpSound();
        setTimeout(() => {
          notifyAudioChange(false);
          if (onEndCallback) onEndCallback();
        }, 1300);
        return;
      }

      try {
        const audio = new Audio(soundUrl);
        audio.volume = 0.95;
        activeAudioInstance = audio;
        notifyAudioChange(true);

        const handleFinish = () => {
          if (activeAudioInstance === audio) {
            activeAudioInstance = null;
          }
          notifyAudioChange(false);
          if (onEndCallback) onEndCallback();
        };

        audio.onended = handleFinish;
        audio.onerror = handleFinish;

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Autoplay bloqueado o formato incompatible, activando sintetizador:", err);
            playElectricWarpSound();
            setTimeout(handleFinish, 1200);
          });
        }
      } catch (err) {
        console.warn("Audio error:", err);
        notifyAudioChange(false);
        if (onEndCallback) onEndCallback();
      }
    }

    // -------------------------------------------------------------------------
    // 4. Componente de Instrumentación: Tacómetro / Velocímetro SVG Animado
    // -------------------------------------------------------------------------
    function AnimatedGauge({ value, max, label, unit, color }) {
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const progress = Math.min(1, Math.max(0, value / max));
      const strokeDashoffset = circumference - progress * circumference;

      return (
        <div className="gauge-card">
          <div className="gauge-svg-wrap">
            <svg className="gauge-svg" viewBox="0 0 100 100">
              <circle
                className="gauge-circle-bg"
                cx="50"
                cy="50"
                r={radius}
              />
              <circle
                className="gauge-circle-val"
                cx="50"
                cy="50"
                r={radius}
                stroke={color || 'var(--accent-cyan)'}
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
              />
            </svg>
            <div className="gauge-number" style={{ color: color || '#fff' }}>
              {value}
            </div>
          </div>
          <div className="gauge-title">
            {label} <span style={{ color: color || 'var(--accent-cyan)' }}>({unit})</span>
          </div>
        </div>
      );
    }

                  <button 
                    className="btn-primary"
                    style={{ background: `linear-gradient(135deg, ${selectedBrand.color}, #ff5e00)` }}
                    onClick={() => handleInspect({ Model_Name: selectedBrand.heroModel, Model_ID: 101, Make_ID: 999 })}
                  >
                    <span>⚡</span> INSPECCIONAR {selectedBrand.heroModel}
                  </button>

                  <button className="btn-rev" onClick={handleHeroSoundClick}>
                    <span>🔊</span> ESCUCHAR MOTOR ORIGINAL
                  </button>

                  {/* Botón de Detención en el Hero */}
                  {isPlayingAudio && (
                    <button className="btn-stop" onClick={handleStopAudioClick}>
                      <span>⏹️</span> DETENER MOTOR
                    </button>
                  )}
                </div>
              </div>

              {/* Telemetría y Preview del Modelo Insignia */}
              <div className="hero-car-preview">
                <div className="hero-img-wrap">
                  <img src={selectedBrand.heroImg} alt={selectedBrand.heroModel} />
                </div>
                <div className="hero-hud-telemetry">
                  <div className="telemetry-item">
                    <div className="telemetry-val" style={{ color: selectedBrand.color }}>{selectedBrand.heroHp}</div>
                    <div className="telemetry-label">Potencia</div>
                  </div>
                  <div className="telemetry-item">
                    <div className="telemetry-val" style={{ color: 'var(--accent-cyan)' }}>{selectedBrand.heroSpeed}</div>
                    <div className="telemetry-label">Vel. Punta</div>
                  </div>
                  <div className="telemetry-item">
                    <div className="telemetry-val" style={{ color: '#ff0055' }}>{selectedBrand.heroZeroToHundred}</div>
                    <div className="telemetry-label">0 - 100 km/h</div>
                  </div>
                </div>
              </div>
            </section>

            {/* Selector de Fabricantes Mundiales */}
            <section className="brands-section">
              <div className="section-head">
                <h2 className="section-title">
                  <span>🏁</span> Fabricantes Mundiales
                </h2>
                <span className="section-count">{BRANDS_DATABASE.length} Marcas Internacionales</span>
              </div>

              <div className="brands-grid">
                {BRANDS_DATABASE.map(b => (
                  <button
                    key={b.id}
                    className={`brand-card-btn ${selectedBrand.id === b.id ? 'active' : ''}`}
                    style={{ '--brand-accent': b.color }}
                    onClick={() => handleBrandSelect(b)}
                  >
                    <span className="brand-card-emblem">{b.emblem}</span>
                    <span className="brand-card-name">{b.name}</span>
                    <span className="brand-card-country">{b.flag} {b.country}</span>
                  </button>
                ))}
              </div>
            </section>

            {/* Explorador de Modelos */}
            <section className="brands-section">
              <div className="section-head">
                <h2 className="section-title">
                  <span>🚘</span> Catálogo de Modelos: {selectedBrand.name}
                </h2>
                <span className="section-count">
                  {loadingModels ? 'Cargando modelos...' : `${filteredModels.length} de ${modelsList.length} modelos disponibles`}
                </span>
              </div>

              {/* Toolbar de Búsqueda en Tiempo Real */}
              <div className="toolbar-wrap">
                <div className="search-input-box">
                  <span style={{ color: 'var(--accent-cyan)' }}>🔍</span>
                  <input
                    type="text"
                    placeholder={`Buscar en los modelos de ${selectedBrand.name} (ej. GT3, F8, Plaid, Supra, M3, Corolla, RAV4)...`}
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                  {searchTerm && (
                    <button 
                      onClick={() => setSearchTerm('')} 
                      style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer' }}
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* Grilla de Tarjetas de Modelos */}
              {loadingModels ? (
                <div className="empty-state">
                  <div className="loading-spinner"></div>
                  <p>Consultando la API pública de modelos de vehículos...</p>
                </div>
              ) : filteredModels.length === 0 ? (
                <div className="empty-state">
                  <p>No se encontraron modelos coincidentes con "{searchTerm}".</p>
                </div>
              ) : (
                <div className="vehicles-grid">
                  {filteredModels.slice(0, 60).map((vehicle, idx) => {
                    const cardImg = resolveCardImage(selectedBrand, vehicle.Model_Name, vehicle.Model_ID);
                    return (
                      <div 
                        key={vehicle.Model_ID || idx} 
                        className="car-card"
                        onClick={() => handleInspect(vehicle)}
                      >
                        <div className="car-thumb-wrap">
                          <img 
                            src={cardImg} 
                            alt={vehicle.Model_Name} 
                            loading="lazy" 
                          />
                          <span className="car-id-tag">ID #{vehicle.Model_ID}</span>
                        </div>
                        <div className="car-body">
                          <div>
                            <div className="car-make-name">{selectedBrand.name}</div>
                            <div className="car-model-name">{vehicle.Model_Name}</div>
                          </div>
                          <div>
                            <div className="car-specs-row">
                              <span>Origen: {selectedBrand.country}</span>
                              <span>{selectedBrand.flag}</span>
                            </div>
                            <button className="car-inspect-btn">
                              <span>⚡</span> INSPECCIONAR MODELO
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

          </main>

          {/* Modal Cockpit Inspector (Toda la info en el portal, sin salir) */}
          {inspectedVehicle && (
            <VehicleCockpitModal
              vehicle={inspectedVehicle}
              brand={selectedBrand}
              onClose={() => setInspectedVehicle(null)}
            />
          )}

          {/* Footer */}
          <footer className="footer-bar">
            <div className="footer-content">
              <p><strong>APEX // DRIVE</strong> &bull; Portal de Inteligencia Automotriz y Catálogo Mundial de Vehículos</p>
              <p>Desarrollado en React 18 &bull; Consumiendo APIs Públicas REST (NHTSA vPIC & Wikipedia Intelligence)</p>
              <p>&copy; 2026 Dise&ntilde;o de Sistemas de Internet &bull; Universidad Nacional de Ingenier&iacute;a (UNI)</p>
            </div>
          </footer>
        </>
      );
    }

    // Montar la aplicación React en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
